<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found, Muhammad Ibrahim</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232b4bf2'/><text x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'>MI</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Deliberately self contained. GitHub serves this file for any unmatched
     path, including nested ones, so a relative stylesheet link would fail to
     resolve and an absolute one would break whenever the site is published
     under a subpath. Inlining is the only version that is right in all cases. */
  :root { --ink:#14161a; --muted:#767d8a; --faint:#a5abb6; --line:#e8eaee;
          --wash:#f7f8fa; --blue:#2b4bf2; --blue-dk:#1e39d4; }
  * , *::before, *::after { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--ink); -webkit-font-smoothing:antialiased;
         font-family:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  a { color:inherit; text-decoration:none; }
  .shell { max-width:1000px; margin:0 auto; }
  .hdr { display:flex; align-items:center; padding:26px 44px 22px; }
  .brand b { display:block; font-size:13.5px; font-weight:700; letter-spacing:-.01em; }
  .brand span { display:block; font-size:12.5px; color:var(--faint); font-weight:500; }
  .nf { min-height:70vh; display:flex; flex-direction:column; align-items:flex-start;
        justify-content:center; padding:0 44px; }
  .code { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
          color:var(--faint); margin-bottom:18px; }
  h1 { margin:0; font-size:clamp(1.8rem,4vw,2.6rem); letter-spacing:-.035em;
       line-height:1.12; font-weight:600; }
  p { margin:18px 0 30px; font-size:14px; color:var(--muted); line-height:1.75; max-width:34em; }
  .btn-row { display:flex; flex-wrap:wrap; gap:10px; }
  .btn { display:inline-flex; align-items:center; font-size:12.5px; font-weight:600;
         padding:9px 17px; border-radius:999px; border:1px solid transparent;
         transition:background .18s ease, border-color .18s ease; }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-primary:hover { background:var(--blue-dk); }
  .btn-ghost { border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover { background:var(--wash); border-color:#d3d7e0; }
  @media (max-width:760px) { .hdr, .nf { padding-left:22px; padding-right:22px; } }
</style>
</head>
<body>

<div class="shell">
  <header class="hdr">
    <a class="brand" id="brandLink" href="./">
      <b>Muhammad Ibrahim</b>
      <span>Product Manager</span>
    </a>
  </header>

  <main class="nf">
    <div class="code">Error 404</div>
    <h1>This page does not exist.</h1>
    <p>The link is either out of date or slightly wrong. Everything lives on the one
       page, so the fastest way back is the button below.</p>
    <div class="btn-row">
      <a class="btn btn-primary" id="homeLink" href="./">Back to home</a>
      <a class="btn btn-ghost" id="workLink" href="./#work">See the work</a>
    </div>
  </main>
</div>

<script>
/* Point the links at the real site root. On a GitHub Pages project site the
   root is /<repo>/, on a user site or a custom domain it is /. Deriving it
   here keeps this page correct without hardcoding either shape. */
(function () {
  /* Published as a GitHub Pages USER site (mibbrahim.github.io), so the site
     root is the domain root and this stays empty. If it is ever moved to a
     project repo, set this to that repo name and the links keep working. */
  var PROJECT_REPO = '';

  var first = location.pathname.split('/').filter(Boolean)[0];
  var base = (first === PROJECT_REPO) ? '/' + PROJECT_REPO + '/' : '/';

  ['brandLink', 'homeLink'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.href = base;
  });
  var w = document.getElementById('workLink');
  if (w) w.href = base + '#work';
})();
</script>
</body>
</html>
